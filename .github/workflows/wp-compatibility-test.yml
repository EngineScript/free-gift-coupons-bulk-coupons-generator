  admin-script-tests:
    name: Admin Script Tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          # PHP renders the page markup and script settings the tests load.
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Setup Node.js 24
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install npm dependencies
        id: install_npm_dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ls jsdom

      - name: Run admin script tests
        id: run_admin_script_tests
        run: |
          mkdir -p "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics"
          node --version
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/admin-script-tests.tap" \
            "tests/js/**/*.test.mjs"
          # A run that found no tests must not pass.
          grep -Eq '^# pass [1-9]' "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/admin-script-tests.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/admin-script-tests.tap"
          # This control must fail because of its assertion.
          printf '%s\n' \
            "import assert from 'node:assert/strict';" \
            "import { test } from 'node:test';" \
            "test( 'intentional failure', () => assert.equal( 1, 2, 'Admin script intentional assertion control' ) );" \
            > "$RUNNER_TEMP/fgcbg-intentional-failure.test.mjs"
          if node --test "$RUNNER_TEMP/fgcbg-intentional-failure.test.mjs" > "$RUNNER_TEMP/fgcbg-intentional-failure.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          fi
          grep -q 'Admin script intentional assertion control' "$RUNNER_TEMP/fgcbg-intentional-failure.txt"
          echo 'Intentional-assertion control failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            setup_node=${{ steps.setup_node.outcome }}
            install_npm_dependencies=${{ steps.install_npm_dependencies.outcome }}
            run_admin_script_tests=${{ steps.run_admin_script_tests.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/run.txt"
          if command -v node >/dev/null; then
            node --version > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/node.txt"
          fi
          if command -v npm >/dev/null && [ -d node_modules ]; then
            npm ls --all --depth=1 > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/dependencies.txt" 2>&1 || true
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics" -type l -delete
          find "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-admin-script-tests
          path: |
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/run.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/steps.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/node.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/dependencies.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/admin-script-tests.tap
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on admin script test failure
        id: create_issue_on_admin_script_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php_8_3.outcome == 'failure' && 'setup_php_8_3' || steps.setup_node.outcome == 'failure' && 'setup_node' || steps.install_npm_dependencies.outcome == 'failure' && 'install_npm_dependencies' || steps.run_admin_script_tests.outcome == 'failure' && 'run_admin_script_tests' || 'unknown_or_canceled' }}
          NODE_VERSION: '24'
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/admin-script-test-failure.md
          update_existing: false

  wp-version-test:
    name: Test WordPress ${{ matrix.wp-version }} with PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        wp-version: ['7.0', 'latest', 'nightly']
        dependency-versions: ['highest']
        include:
          - php-version: '8.2'
            wp-version: 'latest'
            dependency-versions: 'lowest'
      fail-fast: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        id: setup_php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Use isolated Composer auth
        id: use_isolated_composer_auth
        run: |
          # Avoid inheriting a masked or malformed GitHub OAuth token from Composer auth.
          composer_home="${RUNNER_TEMP}/composer-home"
          composer_cache="${RUNNER_TEMP}/composer-cache"

          mkdir -p "$composer_home" "$composer_cache"

          {
            echo "COMPOSER_HOME=$composer_home"
            echo "COMPOSER_CACHE_DIR=$composer_cache"
            echo 'COMPOSER_AUTH={"github-oauth":{"github.com":"${{ github.token }}"}}'
          } >> "$GITHUB_ENV"

      - name: PHP syntax lint
        id: php_syntax_lint
        run: |
          find . \
            -path './vendor' -prune -o \
            -path './tests' -prune -o \
            -path './build' -prune -o \
            -path './plugin-check-build' -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Subversion
        id: install_subversion
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
          composer-options: "--prefer-dist --no-progress"

      - name: Run unit tests
        id: run_unit_tests
        run: |
          # The tracked unit suite needs no WordPress install. It runs here, on the
          # Composer-resolved PHPUnit and with the tracked phpunit.xml and
          # tests/bootstrap.php, before the next steps pin PHPUnit 9.6 and generate
          # the WordPress integration bootstrap and configuration in their place.
          vendor/bin/phpunit --version
          vendor/bin/phpunit --configuration phpunit.xml --testsuite unit --fail-on-empty-test-suite

      - name: Pin PHPUnit for WordPress test suite
        id: pin_phpunit_for_wordpress_test_suite
        run: |
          # The WordPress test library still calls PHPUnit APIs removed in PHPUnit 10+.
          # Keep this generated integration-test job on PHPUnit 9.6 while the rest
          # of the project can continue using newer Composer-resolved QA tooling.
          if [ "${{ matrix.dependency-versions }}" = "lowest" ]; then
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --prefer-lowest --no-progress
          else
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --no-progress
          fi

      - name: Verify PHPUnit dependency versions
        id: verify_phpunit_dependency_versions
        run: |
          composer show phpunit/phpunit
          composer show yoast/phpunit-polyfills
          vendor/bin/phpunit --version | grep -E '^PHPUnit 9\.6\.'

      - name: Prepare Database
        id: prepare_database
        run: |
          mysql -u root --password=root --host=127.0.0.1 --port=3306 -e "DROP DATABASE IF EXISTS wordpress_test;"
          mysqladmin -u root --password=root --host=127.0.0.1 --port=3306 --force create wordpress_test

      - name: Create tests directory structure
        id: create_tests_directory_structure
        run: |
          mkdir -p tests/bin
          mkdir -p tests/bootstrap

      - name: Create WP tests install script
        id: create_wp_tests_install_script
        run: |
          cat > tests/bin/install-wp-tests.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          set +x
          umask 077

          if [ $# -lt 3 ]; then
            echo "usage: $0 <db-name> <db-user> <db-pass> [db-host] [wp-version] [skip-database-creation]"
            exit 1
          fi

          DB_NAME=$1
          DB_USER=$2
          DB_PASS=$3
          DB_HOST=${4-localhost}
          WP_VERSION=${5-latest}
          SKIP_DB_CREATE=${6-false}

          WP_TESTS_DIR=${WP_TESTS_DIR-/tmp/wordpress-tests-lib}
          WP_CORE_DIR=${WP_CORE_DIR-/tmp/wordpress/}

          # Only the isolated GitHub service database is in scope.
          [[ $DB_NAME == wordpress_test && $DB_HOST == 127.0.0.1:3306 ]]
          [[ $SKIP_DB_CREATE == true || $SKIP_DB_CREATE == false ]]

          download() {
              curl --fail --silent --show-error --location \
                  --proto '=https' --proto-redir '=https' \
                  --connect-timeout 20 --max-time 180 --retry 3 \
                  "$1" --output "$2"
              test -s "$2"
          }

          if [[ $WP_VERSION == latest ]]; then
              download https://api.wordpress.org/core/version-check/1.7/ /tmp/wp-latest.json
              WP_VERSION=$(php -r '
                  $data = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
                  $versions = [];
                  foreach ($data["offers"] ?? [] as $offer) {
                      if (($offer["response"] ?? null) !== "upgrade") {
                          continue;
                      }
                      $version = $offer["current"] ?? null;
                      if (!is_string($version) || !preg_match("/\A[0-9]+\.[0-9]+(?:\.[0-9]+)?\z/", $version)) {
                          throw new RuntimeException("Invalid stable WordPress offer.");
                      }
                      $versions[$version] = true;
                  }
                  if (count($versions) !== 1) {
                      throw new RuntimeException("Expected exactly one stable WordPress release.");
                  }
                  echo array_key_first($versions);
              ' /tmp/wp-latest.json)
          fi

          if [[ $WP_VERSION =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              WP_TESTS_TAG="tags/$WP_VERSION"
          elif [[ $WP_VERSION == nightly || $WP_VERSION == trunk ]]; then
              WP_TESTS_TAG=trunk
          else
              echo "Invalid WordPress version selector" >&2
              exit 1
          fi
          WP_SOURCE_URL="https://develop.svn.wordpress.org/$WP_TESTS_TAG"
          WP_REVISION=$(svn info --non-interactive --show-item revision "$WP_SOURCE_URL")
          [[ $WP_REVISION =~ ^[0-9]+$ ]]

          install_wp() {
              # Do not silently reuse a partial install.
              [[ ! -e $WP_CORE_DIR && ! -L $WP_CORE_DIR ]]
              if [[ $WP_TESTS_TAG == trunk ]]; then
                  # Nightly core and test fixtures use one immutable SVN snapshot.
                  svn export --non-interactive --quiet -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/src@$WP_REVISION" "$WP_CORE_DIR"
              else
                  mkdir -p "$WP_CORE_DIR"
                  download "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" /tmp/wordpress.tar.gz
                  tar --strip-components=1 -zxf /tmp/wordpress.tar.gz -C "$WP_CORE_DIR"
              fi

              # setup-php supplies native mysqli; never fetch a mutable third-party db.php.
              php -r 'exit(extension_loaded("mysqli") ? 0 : 1);'
              test ! -e "$WP_CORE_DIR/wp-content/db.php"
              CORE_VERSION=$(php -r 'require $argv[1]; echo $wp_version;' "$WP_CORE_DIR/wp-includes/version.php")
              SOURCE_VERSION=$(svn cat --non-interactive -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/src/wp-includes/version.php@$WP_REVISION" |
                  php -r '$source = stream_get_contents(STDIN); if (!preg_match("/\\\$wp_version\s*=\s*\x27([^\x27]+)\x27/", $source, $match)) { exit(1); } echo $match[1];')
              [[ ${CORE_VERSION%-src} == "${SOURCE_VERSION%-src}" ]]
              if [[ $WP_TESTS_TAG != trunk ]]; then
                  [[ ${CORE_VERSION%-src} == "$WP_VERSION" ]]
              fi
              mkdir -p "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics"
              printf 'core=%s\nsource=%s\nrevision=%s\n' "$CORE_VERSION" "$WP_TESTS_TAG" "$WP_REVISION" \
                  > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/wordpress.txt"
          }

          install_test_suite() {
              [[ ! -e $WP_TESTS_DIR && ! -L $WP_TESTS_DIR ]]
              mkdir -p "$WP_TESTS_DIR"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/includes@$WP_REVISION" "$WP_TESTS_DIR/includes"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/data@$WP_REVISION" "$WP_TESTS_DIR/data"

              if [ ! -f "$WP_TESTS_DIR/wp-tests-config.php" ]; then
                  svn cat --non-interactive -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/wp-tests-config-sample.php@$WP_REVISION" \
                      > "$WP_TESTS_DIR/wp-tests-config.php"
                  export WP_TESTS_DIR WP_CORE_DIR DB_NAME DB_USER DB_PASS DB_HOST
                  # Quote PHP literals safely; do not interpolate credentials through sed.
                  php -r '
                      $path = getenv("WP_TESTS_DIR") . "/wp-tests-config.php";
                      $config = file_get_contents($path);
                      $replacements = [
                          "dirname( __FILE__ ) . \x27/src/\x27" => rtrim(getenv("WP_CORE_DIR"), "/") . "/",
                          "\x27youremptytestdbnamehere\x27" => getenv("DB_NAME"),
                          "\x27yourusernamehere\x27" => getenv("DB_USER"),
                          "\x27yourpasswordhere\x27" => getenv("DB_PASS"),
                          "\x27localhost\x27" => getenv("DB_HOST"),
                      ];
                      foreach ($replacements as $needle => $value) {
                          if (substr_count($config, $needle) !== 1) {
                              throw new RuntimeException("Unexpected WordPress test config template.");
                          }
                          $config = str_replace($needle, var_export($value, true), $config);
                      }
                      if (file_put_contents($path, $config) !== strlen($config)) {
                          throw new RuntimeException("Cannot write WordPress test config.");
                      }
                  '
              fi
          }

          install_db() {
              if [[ $SKIP_DB_CREATE == true ]]; then
                  return
              fi
              # Fallback is limited to this job's disposable service and never drops a DB.
              MYSQL_PWD="$DB_PASS" mysql --user="$DB_USER" --host=127.0.0.1 --port=3306 \
                  -e 'CREATE DATABASE wordpress_test'
          }

          install_wp
          install_test_suite
          install_db
          EOF
          chmod +x tests/bin/install-wp-tests.sh

      - name: Create Bootstrap File
        id: create_bootstrap_file
        run: |
          mkdir -p tests
          cat > tests/bootstrap.php << 'EOF'
          <?php
          /**
           * PHPUnit bootstrap file for plugin tests.
           *
           * WordPress is real in this job. WooCommerce and Free Gift Coupons for
           * WooCommerce are not installed on the runner, so the classes and functions
           * below stand in for the parts of WooCommerce that the plugin calls.
           *
           * @package FreeGiftCouponsBulkGenerator
           */

          define( 'WP_TESTS_PHPUNIT_POLYFILLS_PATH', dirname( __DIR__ ) . '/vendor/yoast/phpunit-polyfills' );
          require_once '/tmp/wordpress-tests-lib/includes/functions.php';

          $GLOBALS['fgcbg_test_products'] = array();
          $GLOBALS['fgcbg_test_coupons']  = array();
          $GLOBALS['fgcbg_test_log']      = array();

          if ( ! class_exists( 'WooCommerce' ) ) {
              class WooCommerce {}
          }

          class FGCBG_WP_Test_Product {
              private $name;
              private $parent_id;
              private $status;

              public function __construct( $name, $parent_id = 0, $status = 'publish' ) {
                  $this->name      = $name;
                  $this->parent_id = $parent_id;
                  $this->status    = $status;
              }

              public function get_name() {
                  return $this->name;
              }

              public function get_parent_id() {
                  return $this->parent_id;
              }

              public function get_status() {
                  return $this->status;
              }

              public function is_purchasable() {
                  return 'publish' === $this->status;
              }
          }

          if ( ! function_exists( 'wc_get_product' ) ) {
              function wc_get_product( $product_id ) {
                  return $GLOBALS['fgcbg_test_products'][ $product_id ] ?? false;
              }
          }

          if ( ! function_exists( 'wc_get_coupon_types' ) ) {
              function wc_get_coupon_types() {
                  if ( isset( $GLOBALS['fgcbg_test_coupon_types'] ) ) {
                      return $GLOBALS['fgcbg_test_coupon_types'];
                  }

                  return array(
                      'fixed_cart'    => 'Fixed cart discount',
                      'fixed_product' => 'Fixed product discount',
                      'percent'       => 'Percentage discount',
                      'free_gift'     => 'Free Gift',
                  );
              }
          }

          if ( ! class_exists( 'WC_Coupon' ) ) {
              class WC_Coupon {
                  private $id    = 0;
                  private $props = array();
                  private $meta  = array();

                  public function set_code( $code ) {
                      $this->props['code'] = $code;
                  }

                  public function set_description( $description ) {
                      $this->props['description'] = $description;
                  }

                  public function set_discount_type( $type ) {
                      $this->props['discount_type'] = $type;
                  }

                  public function set_individual_use( $individual_use ) {
                      $this->props['individual_use'] = $individual_use;
                  }

                  public function set_usage_limit( $usage_limit ) {
                      $this->props['usage_limit'] = $usage_limit;
                  }

                  public function set_date_expires( $date_expires ) {
                      $this->props['date_expires'] = $date_expires;
                  }

                  public function update_meta_data( $key, $value ) {
                      $this->meta[ $key ] = $value;
                  }

                  public function save() {
                      $this->id                        = count( $GLOBALS['fgcbg_test_coupons'] ) + 1;
                      $GLOBALS['fgcbg_test_coupons'][] = $this;
                  }

                  public function get_id() {
                      return $this->id;
                  }

                  public function get_code() {
                      return $this->props['code'] ?? '';
                  }

                  public function get_discount_type() {
                      return $this->props['discount_type'] ?? '';
                  }

                  public function get_prop( $key ) {
                      return $this->props[ $key ] ?? null;
                  }

                  public function get_meta( $key ) {
                      return $this->meta[ $key ] ?? null;
                  }
              }
          }

          if ( ! function_exists( 'wc_get_logger' ) ) {
              function wc_get_logger() {
                  return new class() {
                      public function error( $message = '', $context = array() ) {
                          $GLOBALS['fgcbg_test_log'][] = (string) $message;
                      }
                  };
              }
          }

          if ( ! function_exists( 'wc_get_coupon_id_by_code' ) ) {
              function wc_get_coupon_id_by_code( $code ) {
                  foreach ( $GLOBALS['fgcbg_test_coupons'] as $coupon ) {
                      if ( $coupon->get_code() === $code ) {
                          return $coupon->get_id();
                      }
                  }

                  return 0;
              }
          }

          function _manually_load_plugin() {
              add_filter('widgets_init', function() {
                  return;
              }, 0);

              require dirname( dirname( __FILE__ ) ) . '/free-gift-bulk-coupon-generator.php';
          }

          tests_add_filter( 'muplugins_loaded', '_manually_load_plugin' );

          require '/tmp/wordpress-tests-lib/includes/bootstrap.php';
          EOF

      - name: Create Test File
        id: create_test_file
        run: |
          # The generated suite lives in tests/integration so that the WordPress
          # configuration below does not pick up the tracked tests/unit suite,
          # which has its own bootstrap and has already run.
          mkdir -p tests/integration
          cat > tests/integration/FgcbgPluginTest.php << 'EOF'
          <?php
          /**
           * Class FgcbgPluginTest
           *
           * @package FreeGiftCouponsBulkGenerator
           */

          class FgcbgPluginTest extends WP_UnitTestCase {
              private const CODE_PATTERN = '/\A[abcdefghjkmnpqrstuvwxyz23456789]{12}\z/';

              public function set_up() {
                  parent::set_up();

                  $GLOBALS['fgcbg_test_products'] = [
                      123 => new FGCBG_WP_Test_Product('Sample Mug'),
                      456 => new FGCBG_WP_Test_Product('Sticker Pack'),
                      500 => new FGCBG_WP_Test_Product('Retired Mug', 0, 'trash'),
                      789 => new FGCBG_WP_Test_Product('Sample Hoodie - Blue', 456),
                  ];
                  $GLOBALS['fgcbg_test_coupons'] = [];
                  $GLOBALS['fgcbg_test_log']     = [];
              }

              public function tear_down() {
                  unset($GLOBALS['fgcbg_test_coupon_types']);
                  wp_set_current_user(0);
                  parent::tear_down();
              }

              public function test_plugin_loaded() {
                  $this->assertTrue(function_exists('fgcbg_init'), 'Plugin was not loaded correctly');
                  $this->assertTrue(fgcbg_is_loaded());
                  $this->assertTrue(class_exists('FGCBG_Coupon_Generator'));
                  $this->assertInstanceOf(FGCBG_Plugin::class, FGCBG_Plugin::get_instance());
                  $this->assertSame(10, has_action('plugins_loaded', 'fgcbg_init'));
                  $this->assertSame(10, has_action('before_woocommerce_init', 'fgcbg_declare_woocommerce_compatibility'));
              }

              public function test_plugin_constants_defined() {
                  $this->assertTrue(defined('FGCBG_PLUGIN_VERSION'));
                  $this->assertNotEmpty(FGCBG_PLUGIN_VERSION);
                  $this->assertTrue(defined('FGCBG_PLUGIN_URL'));
                  $this->assertTrue(defined('FGCBG_PLUGIN_PATH'));
                  $this->assertFileExists(FGCBG_PLUGIN_PATH . 'free-gift-bulk-coupon-generator.php');
              }

              public function test_plugin_header_declares_requirements() {
                  $headers = get_file_data(FGCBG_PLUGIN_PATH . 'free-gift-bulk-coupon-generator.php', [
                      'version'          => 'Version',
                      'requires_plugins' => 'Requires Plugins',
                      'requires_wp'      => 'Requires at least',
                      'requires_php'     => 'Requires PHP',
                      'tested_wp'        => 'Tested up to',
                      'update_uri'       => 'Update URI',
                      'text_domain'      => 'Text Domain',
                  ]);
                  $this->assertSame(FGCBG_PLUGIN_VERSION, $headers['version']);
                  $this->assertSame('woocommerce', $headers['requires_plugins']);
                  $this->assertSame('7.0', $headers['requires_wp']);
                  $this->assertSame('8.2', $headers['requires_php']);
                  $this->assertSame('7.1', $headers['tested_wp']);
                  // WordPress.org does not allow an Update URI header, and Plugin Check rejects it.
                  $this->assertSame('', $headers['update_uri']);
                  $this->assertSame('free-gift-bulk-coupon-generator', $headers['text_domain']);
              }

              public function test_coupon_generation_creates_free_gift_metadata() {
                  $generator = new FGCBG_Coupon_Generator();
                  $generated = $generator->generate_coupons([123, 456], 1, 'GIFT');

                  $this->assertSame(1, $generated);
                  $this->assertCount(1, $GLOBALS['fgcbg_test_coupons']);

                  $coupon = $GLOBALS['fgcbg_test_coupons'][0];

                  $this->assertStringStartsWith('gift', $coupon->get_code());
                  $this->assertMatchesRegularExpression(self::CODE_PATTERN, substr($coupon->get_code(), 4));
                  $this->assertSame('free_gift', $coupon->get_discount_type());
                  $this->assertTrue($coupon->get_prop('individual_use'));
                  $this->assertSame(1, $coupon->get_prop('usage_limit'));
                  $this->assertGreaterThan(time() + 364 * DAY_IN_SECONDS, $coupon->get_prop('date_expires'));
                  $this->assertLessThanOrEqual(time() + 365 * DAY_IN_SECONDS, $coupon->get_prop('date_expires'));
                  $this->assertStringContainsString('Sample Mug', $coupon->get_prop('description'));
                  $this->assertStringContainsString('Sticker Pack', $coupon->get_prop('description'));
                  $this->assertSame([123, 456], $coupon->get_meta('_fgcbg_product_ids'));
                  $this->assertTrue($coupon->get_meta('_fgcbg_generated'));
                  $this->assertSame('no', $coupon->get_meta('_wc_free_gift_coupon_free_shipping'));
                  $this->assertSame([], $coupon->get_meta('_wc_fgc_product_sync_ids'));
                  $this->assertSame(
                      [
                          123 => [
                              'product_id' => 123,
                              'variation_id' => 0,
                              'quantity' => 1,
                          ],
                          456 => [
                              'product_id' => 456,
                              'variation_id' => 0,
                              'quantity' => 1,
                          ],
                      ],
                      $coupon->get_meta('_wc_free_gift_coupon_data')
                  );
                  $this->assertSame([], $GLOBALS['fgcbg_test_log']);
              }

              public function test_generated_codes_use_the_code_alphabet_and_are_unique() {
                  $generator = new FGCBG_Coupon_Generator();
                  $result    = $generator->generate_coupon_batch([123], 30);

                  $this->assertSame(30, $result['generated']);
                  $this->assertCount(30, array_unique($result['codes']));
                  foreach ($result['codes'] as $code) {
                      $this->assertMatchesRegularExpression(self::CODE_PATTERN, $code);
                  }
              }

              public function test_invalid_product_ids_do_not_create_coupons() {
                  $generator = new FGCBG_Coupon_Generator();
                  $generated = $generator->generate_coupons([999], 3);

                  $this->assertSame(0, $generated);
                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }

              public function test_trashed_products_are_not_usable() {
                  $generator = new FGCBG_Coupon_Generator();

                  $this->assertTrue($generator->are_products_usable([123, 456, 789]));
                  $this->assertFalse($generator->are_products_usable([123, 500]));
                  $this->assertSame(0, $generator->generate_coupons([500], 1));
                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }

              public function test_variation_gift_coupon_metadata_uses_upstream_shape() {
                  $generator = new FGCBG_Coupon_Generator();
                  $generated = $generator->generate_coupons([789], 1);

                  $this->assertSame(1, $generated);

                  $coupon = $GLOBALS['fgcbg_test_coupons'][0];

                  $this->assertSame(
                      [
                          789 => [
                              'product_id' => 456,
                              'variation_id' => 789,
                              'quantity' => 1,
                          ],
                      ],
                      $coupon->get_meta('_wc_free_gift_coupon_data')
                  );
                  $this->assertSame([789], $coupon->get_meta('_fgcbg_product_ids'));
              }

              public function test_free_gift_notice_uses_the_core_admin_notice() {
                  wp_set_current_user(self::factory()->user->create(['role' => 'administrator']));
                  $plugin = FGCBG_Plugin::get_instance();

                  ob_start();
                  $plugin->free_gift_coupons_missing_notice();
                  $this->assertSame('', ob_get_clean(), 'No notice while the coupon type is registered.');

                  $GLOBALS['fgcbg_test_coupon_types'] = ['percent' => 'Percentage discount'];

                  ob_start();
                  $plugin->free_gift_coupons_missing_notice();
                  $html = ob_get_clean();

                  $this->assertStringContainsString('notice-error', $html);
                  $this->assertStringContainsString('requires Free Gift Coupons for WooCommerce', $html);

                  wp_set_current_user(self::factory()->user->create(['role' => 'subscriber']));

                  ob_start();
                  $plugin->free_gift_coupons_missing_notice();
                  $this->assertSame('', ob_get_clean(), 'Users who cannot activate plugins do not see the notice.');
              }

              public function test_wordpress_version_compatibility() {
                  global $wp_version;
                  $this->assertNotEmpty($wp_version, 'WordPress version should be available');

                  // Test that we're running on a supported WordPress version
                  $min_wp_version = '7.0';
                  $this->assertTrue(version_compare(preg_replace('/-src$/', '', $wp_version), $min_wp_version, '>='),
                      "WordPress version {$wp_version} should be >= {$min_wp_version}");
              }
          }
          EOF
          cat > tests/integration/FgcbgAjaxTest.php << 'EOF'
          <?php
          /**
           * Class FgcbgAjaxTest
           *
           * Sends requests through the real admin-ajax action with real WordPress
           * nonces and capabilities.
           *
           * @package FreeGiftCouponsBulkGenerator
           */

          class FgcbgAjaxTest extends WP_Ajax_UnitTestCase {
              public function set_up() {
                  parent::set_up();

                  $GLOBALS['fgcbg_test_products'] = [
                      123 => new FGCBG_WP_Test_Product('Sample Mug'),
                      500 => new FGCBG_WP_Test_Product('Retired Mug', 0, 'trash'),
                      600 => new FGCBG_WP_Test_Product('Unreleased Mug', 0, 'draft'),
                  ];
                  $GLOBALS['fgcbg_test_coupons'] = [];
                  $GLOBALS['fgcbg_test_log']     = [];

                  // The plugin registers this hook only in the admin, which the test bootstrap is not.
                  ( new FGCBG_Ajax_Handler(new FGCBG_Coupon_Generator()) )->register_hooks();
              }

              private function log_in(string $role, array $capabilities = []): void {
                  wp_set_current_user(self::factory()->user->create(['role' => $role]));
                  $user = wp_get_current_user();
                  foreach ($capabilities as $capability) {
                      $user->add_cap($capability);
                  }
              }

              private function send(array $post): array {
                  $_POST = $post + ['nonce' => wp_create_nonce('fgcbg_ajax_nonce')];

                  try {
                      $this->_handleAjax('fgcbg_generate_batch');
                  } catch (WPAjaxDieContinueException $exception) {
                      unset($exception);
                  }

                  $response = json_decode($this->_last_response, true);
                  $this->assertIsArray($response, 'The action must answer with JSON.');

                  return $response;
              }

              public function test_action_is_registered() {
                  $this->assertNotFalse(has_action('wp_ajax_fgcbg_generate_batch'));
                  $this->assertFalse(has_action('wp_ajax_nopriv_fgcbg_generate_batch'));
              }

              public function test_authorized_request_creates_coupons() {
                  $this->log_in('administrator', ['publish_shop_coupons', 'edit_product']);

                  $response = $this->send(['product_ids' => ['123'], 'batch_size' => '2', 'coupon_prefix' => 'GIFT']);

                  $this->assertTrue($response['success']);
                  $this->assertSame(2, $response['data']['generated']);
                  $this->assertCount(2, $response['data']['codes']);
                  $this->assertCount(2, $GLOBALS['fgcbg_test_coupons']);
                  $this->assertSame($response['data']['codes'][0], $GLOBALS['fgcbg_test_coupons'][0]->get_code());
                  $this->assertStringStartsWith('gift', $response['data']['codes'][0]);
                  $this->assertArrayNotHasKey('warning', $response['data']);
              }

              public function test_unpurchasable_product_is_accepted_with_a_warning() {
                  $this->log_in('administrator', ['publish_shop_coupons', 'edit_product']);

                  $response = $this->send(['product_ids' => ['123', '600'], 'batch_size' => '1']);

                  $this->assertTrue($response['success']);
                  $this->assertSame(1, $response['data']['generated']);
                  $this->assertStringContainsString('Unreleased Mug', $response['data']['warning']);
                  $this->assertStringNotContainsString('Sample Mug', $response['data']['warning']);
              }

              public function test_request_with_a_wrong_nonce_is_refused() {
                  $this->log_in('administrator', ['publish_shop_coupons', 'edit_product']);
                  $_POST = ['product_ids' => ['123'], 'nonce' => 'not-a-valid-nonce'];

                  try {
                      $this->_handleAjax('fgcbg_generate_batch');
                      $this->fail('A wrong nonce must end the request.');
                  } catch (WPAjaxDieStopException $exception) {
                      $this->assertSame('-1', $exception->getMessage());
                  }

                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }

              public function test_user_without_the_coupon_capability_is_refused() {
                  $this->log_in('subscriber');

                  $response = $this->send(['product_ids' => ['123']]);

                  $this->assertFalse($response['success']);
                  $this->assertStringContainsString('permission', $response['data']['message']);
                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }

              public function test_product_the_user_cannot_edit_is_refused() {
                  $this->log_in('administrator', ['publish_shop_coupons']);

                  $response = $this->send(['product_ids' => ['123']]);

                  $this->assertFalse($response['success']);
                  $this->assertStringContainsString('permission', $response['data']['message']);
                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }

              public function test_trashed_product_is_refused() {
                  $this->log_in('administrator', ['publish_shop_coupons', 'edit_product']);

                  $response = $this->send(['product_ids' => ['123', '500']]);

                  $this->assertFalse($response['success']);
                  $this->assertStringContainsString('not available', $response['data']['message']);
                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }

              public function test_request_without_products_is_refused() {
                  $this->log_in('administrator', ['publish_shop_coupons', 'edit_product']);

                  $response = $this->send(['product_ids' => [['nested' => '123']]]);

                  $this->assertFalse($response['success']);
                  $this->assertSame([], $GLOBALS['fgcbg_test_coupons']);
              }
          }
          EOF

      - name: Create PHPUnit Config
        id: create_phpunit_config
        run: |
          cat > phpunit.xml << 'EOF'
          <?xml version="1.0"?>
          <phpunit
              bootstrap="tests/bootstrap.php"
              backupGlobals="false"
              colors="true"
              failOnEmptyTestSuite="true"
              failOnRisky="true"
              failOnWarning="true"
          >
              <testsuites>
                  <testsuite name="Free Gift Coupons Bulk Coupon Generator">
                      <directory suffix="Test.php">./tests/integration/</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          EOF

      - name: Setup WP Tests
        id: setup_wp_tests
        timeout-minutes: 15
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp-version }} true

      - name: Run plugin test
        id: run_plugin_test
        run: |
          mkdir -p "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics"
          vendor/bin/phpunit --config phpunit.xml --log-junit "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/junit.xml"
          # Prove that the real generated config rejects an empty filtered suite.
          if vendor/bin/phpunit --config phpunit.xml --do-not-cache-result \
            --filter '__fgcbg_intentionally_no_matching_test__' \
            > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-empty-suite.txt" 2>&1; then
            echo '::error::An empty test suite incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'No tests executed' "$RUNNER_TEMP/free-gift-bulk-coupon-generator-empty-suite.txt"
          fi
          # This control must fail due to its assertion, not a setup/parse error.
          cat > "$RUNNER_TEMP/FgcbgIntentionalFailureTest.php" << 'EOF'
          <?php
          final class FgcbgIntentionalFailureTest extends PHPUnit\Framework\TestCase {
              public function test_intentional_failure(): void {
                  $this->assertTrue(false, 'Free Gift Coupons Bulk Coupon Generator intentional assertion control');
              }
          }
          EOF
          if vendor/bin/phpunit --no-configuration --do-not-cache-result \
            "$RUNNER_TEMP/FgcbgIntentionalFailureTest.php" \
            > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-failing-suite.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'Free Gift Coupons Bulk Coupon Generator intentional assertion control' "$RUNNER_TEMP/free-gift-bulk-coupon-generator-failing-suite.txt"
          fi
          echo 'Empty-suite and intentional-assertion controls failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            use_isolated_composer_auth=${{ steps.use_isolated_composer_auth.outcome }}
            php_syntax_lint=${{ steps.php_syntax_lint.outcome }}
            install_subversion=${{ steps.install_subversion.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            run_unit_tests=${{ steps.run_unit_tests.outcome }}
            pin_phpunit_for_wordpress_test_suite=${{ steps.pin_phpunit_for_wordpress_test_suite.outcome }}
            verify_phpunit_dependency_versions=${{ steps.verify_phpunit_dependency_versions.outcome }}
            prepare_database=${{ steps.prepare_database.outcome }}
            create_tests_directory_structure=${{ steps.create_tests_directory_structure.outcome }}
            create_wp_tests_install_script=${{ steps.create_wp_tests_install_script.outcome }}
            create_bootstrap_file=${{ steps.create_bootstrap_file.outcome }}
            create_test_file=${{ steps.create_test_file.outcome }}
            create_phpunit_config=${{ steps.create_phpunit_config.outcome }}
            setup_wp_tests=${{ steps.setup_wp_tests.outcome }}
            run_plugin_test=${{ steps.run_plugin_test.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics" -type l -delete
          find "$RUNNER_TEMP/free-gift-bulk-coupon-generator-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.dependency-versions }}
          path: |
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/run.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/steps.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/php.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/dependencies.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/wordpress.txt
            ${{ runner.temp }}/free-gift-bulk-coupon-generator-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Report test status
        id: report_test_status
        if: ${{ always() }}
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tests passed successfully on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          else
            echo "❌ Tests failed on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          fi

      - name: Ensure repository files available after failure
        id: ensure_repository_files_available_after_failure
        if: ${{ failure() }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create issue on test failure
        id: create_issue_on_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.use_isolated_composer_auth.outcome == 'failure' && 'use_isolated_composer_auth' || steps.php_syntax_lint.outcome == 'failure' && 'php_syntax_lint' || steps.install_subversion.outcome == 'failure' && 'install_subversion' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.run_unit_tests.outcome == 'failure' && 'run_unit_tests' || steps.pin_phpunit_for_wordpress_test_suite.outcome == 'failure' && 'pin_phpunit_for_wordpress_test_suite' || steps.verify_phpunit_dependency_versions.outcome == 'failure' && 'verify_phpunit_dependency_versions' || steps.prepare_database.outcome == 'failure' && 'prepare_database' || steps.create_tests_directory_structure.outcome == 'failure' && 'create_tests_directory_structure' || steps.create_wp_tests_install_script.outcome == 'failure' && 'create_wp_tests_install_script' || steps.create_bootstrap_file.outcome == 'failure' && 'create_bootstrap_file' || steps.create_test_file.outcome == 'failure' && 'create_test_file' || steps.create_phpunit_config.outcome == 'failure' && 'create_phpunit_config' || steps.setup_wp_tests.outcome == 'failure' && 'setup_wp_tests' || steps.run_plugin_test.outcome == 'failure' && 'run_plugin_test' || steps.report_test_status.outcome == 'failure' && 'report_test_status' || steps.ensure_repository_files_available_after_failure.outcome == 'failure' && 'ensure_repository_files_available_after_failure' || 'unknown_or_canceled' }}
          PHP_VERSION: ${{ matrix.php-version }}
          WP_VERSION: ${{ matrix.wp-version }}
          DEPENDENCY_VERSIONS: ${{ matrix.dependency-versions }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/wp-version-test-failure.md
          update_existing: false
